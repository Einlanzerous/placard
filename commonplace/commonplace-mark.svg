  <!-- The Commonplace mark: the chef's-hat glyph from cook_book's own favicon
       (cook_book@main/frontend/public/favicon.svg, 24-unit grid, stroke 2,
       round caps and joins, #4E8A6A). Change it there and change it here.

       Redrawn on a 512 grid (every coordinate x 21.333) because the
       generator's rasterizer does not scale a stroke width with the viewBox
       (see catenary-mark.svg), and the arcs are flattened to short segments
       (the rasterizer's arc handling is not trusted for these). The
       stroke stays a stroke (width 2 x 21.333 = 42.67); round joins and caps
       keep it matching the favicon. One mid-tone green reads on both light
       and dark tiles, so this one SVG drives both variants. 1:1 by
       construction, with padding, so a square launcher tile shows it whole. -->
